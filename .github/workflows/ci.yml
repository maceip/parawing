name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job, so the Rust crates compile once: the tests and the dev build share one Bazel output
  # tree, and the checks, the lint tests, the Rust host tests, vitest, and CLI tests one invocation.
  ci:
    if: >-
      github.event_name != 'push'
      || !startsWith(github.event.head_commit.message, 'chore(release): bump version to ')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LIM_API_KEY: ${{ secrets.LIM_API_KEY }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          bazel-cache: "true"
          deno: "true"
      - run: pnpm install --frozen-lockfile
      - name: Install CRIU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends criu
          criu --version
      - run: bazel test --keep_going --test_output=errors //:check //:rust_lint //packages/core:host_tests //packages/engine:vitest //packages/parawing-cli:lib_test //packages/parawing-cli:bin_test
      - name: Verify Tier 2 CRIU 4.1.1 capsule freeze and thaw
        run: >
          bazel test --strategy=TestRunner=local
          --test_timeout=900
          --test_env=HOME --test_env=PATH --test_env=PARAWING_REQUIRE_CAPSULE_CRIU=1
          --nocache_test_results --test_output=errors
          //packages/rust-host:host_test --test_arg=capsule --test_arg=--test-threads=1
      - run: pnpm run build
      - name: Fail on generated drift
        run: git diff --exit-code
      - run: pnpm run format:check
      - run: pnpm run lint:js
      - run: bazel run //scripts:workspace_checks
      - name: Verify live OSV advisories and emit dependency VEX report
        uses: ./.github/actions/dependency-integrity
        with:
          mode: online
          vex-out: ${{ runner.temp }}/parawing-deps.openvex.json
      - name: Hermetic e2e smoke gate
        run: pnpm run test:e2e page-script-demo.e2e.test.ts fetch-init-headers.e2e.test.ts storage-cookies.e2e.test.ts inserted-script-cap.e2e.test.ts rbi-v2-channel.e2e.test.ts parawing-page-ops.e2e.test.ts
      - if: always()
        run: df -h /
      # Only main saves, so PR runs cannot evict main's entry from the 10 GB repository quota. Save
      # after a failure too: the actions that did finish are still valid cache entries.
      - if: >-
          !cancelled() && github.ref == 'refs/heads/main' && steps.setup.outputs.bazel-cache-key != ''
          && steps.setup.outputs.bazel-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.bazel-cache-paths }}
          key: ${{ steps.setup.outputs.bazel-cache-key }}
